# Builds the Android APK and an unsigned iOS IPA. Pushing a tag like
# v1.0.1 publishes both as a GitHub release; a manual run just uploads
# them as workflow artifacts.
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Sign with the same key as the installed app, so the APK installs
      # over it as an update.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE is not set; this APK won't install over an existing copy."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          echo "PB_KEYSTORE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk PhotoBridge.apk
      # Fail rather than publish an APK that can't update the installed app.
      - name: Check signing certificate
        if: env.PB_KEYSTORE != ''
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs PhotoBridge.apk | tee certs.txt
          grep -q e4ad90903c06522bec4bd5ca8efc0f2a3d73d558d3aa9f4ae1f9cd168c9beb20 certs.txt
      - uses: actions/upload-artifact@v5
        with:
          name: PhotoBridge.apk
          path: PhotoBridge.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      # SideStore/AltStore sign the app themselves at install time.
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry PhotoBridge.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: PhotoBridge.ipa
          path: PhotoBridge.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" PhotoBridge.apk PhotoBridge.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "PhotoBridge ${GITHUB_REF_NAME#v}" \
            --generate-notes
