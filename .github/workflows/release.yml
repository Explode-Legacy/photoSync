# Builds the Android APK, an unsigned iOS IPA and the Mac app (DMG). Pushing
# a tag like v1.2.0 publishes them as a GitHub release; a manual run just
# uploads them as workflow artifacts.
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The release key (see android/app/build.gradle.kts). Without it the
      # APK is signed with a throwaway key and won't update installed copies.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            # Never publish a release signed with the wrong key.
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::ANDROID_RELEASE_KEYSTORE / ANDROID_RELEASE_PASSWORD secrets are missing."
              exit 1
            fi
            echo "::warning::Release key secrets are not set; this APK won't install over an existing copy."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PB_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "PB_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk PhotoBridge.apk
      # Fail rather than publish an APK that can't update the installed app.
      - name: Check signing certificate
        if: env.PB_KEYSTORE != ''
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs PhotoBridge.apk | tee certs.txt
          grep -q d84048e347b99d04057e52381b3add6aa62fe004e5d65f83b2127fd1276bfb47 certs.txt
      - uses: actions/upload-artifact@v5
        with:
          name: PhotoBridge.apk
          path: PhotoBridge.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      # SideStore/AltStore sign the app themselves at install time.
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry PhotoBridge.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: PhotoBridge.ipa
          path: PhotoBridge.ipa

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Ad-hoc signed ("Sign to Run Locally"); no Apple Developer account.
      - run: flutter build macos --release
      - name: Package DMG
        run: |
          mkdir dmg
          cp -R build/macos/Build/Products/Release/PhotoBridge.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname PhotoBridge -srcfolder dmg -ov -format UDZO PhotoBridge-macOS.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: PhotoBridge-macOS.dmg
          path: PhotoBridge-macOS.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            PhotoBridge.apk PhotoBridge.ipa PhotoBridge-macOS.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "PhotoBridge ${GITHUB_REF_NAME#v}" \
            --generate-notes
      # The app checks this public repository for updates (the source
      # repository is private). Needs a token allowed to create releases there.
      - name: Publish to the public downloads page
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PUBLIC_RELEASES_TOKEN is not set; skipping the public downloads page."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            PhotoBridge.apk PhotoBridge.ipa PhotoBridge-macOS.dmg \
            --repo Explode-Legacy/photoSync-releases \
            --title "PhotoBridge ${GITHUB_REF_NAME#v}" \
            --notes "PhotoBridge ${GITHUB_REF_NAME#v}. See the README for install steps."
